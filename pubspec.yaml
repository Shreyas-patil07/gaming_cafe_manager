name: pc_manager_app
description: "Gaming Cafe Management System"
version: 6.03.007

publish_to: 'none'

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  animations: ^2.0.11
  shared_preferences: ^2.5.3
  awesome_snackbar_content: ^0.1.5
  sqflite: ^2.4.2
  excel: ^4.0.6
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  file_picker: ^10.3.2
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/devices/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0F172A"
  image: assets/images/logo00.png

  android_12:
    image: assets/images/logo00.png
    color: "#0F172A"